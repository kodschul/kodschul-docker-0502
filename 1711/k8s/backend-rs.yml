apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: backend
spec:
  replicas: 3
  selector:
    matchLabels:
      my-app: backend

  template:
    # apiVersion: v1
    # kind: Pod
    metadata:
      #name: backend
      labels:
        my-app: backend

    spec:
      containers:
        - name: app
          image: backend:v1
          ports:
            - containerPort: 80
