apiVersion: apps/v1
kind: ReplicaSet
metadata:
  name: frontend
spec:
  selector:
    matchLabels:
      my-app: frontend

  template:
    # apiVersion: v1
    # kind: Pod
    metadata:
      #name: backend
      labels:
        my-app: frontend

    spec:
      containers:
        - name: app
          image: frontend:v2
          ports:
            - containerPort: 80
